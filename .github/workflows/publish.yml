name: publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
        
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4 
      with:
        node-version: 22.x
        registry-url: 'https://registry.npmjs.org/'
    
    - name: Build
      run: |
        npm ci
        npm run build

    - name: Publish
      working-directory: ./dist
      run: npm publish
      env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: integration

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
        cache: 'npm'
        
    - name: Build & test
      run: |
        npm ci
        npm run build
        npm run test
